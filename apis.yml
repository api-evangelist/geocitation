name: GEOCitation
description: White-label AEO/GEO (Answer Engine / Generative Engine Optimization) audit API for SEO agencies
  and SaaS platforms. A single async REST API that runs AI-visibility/citation-gap audits and returns
  structured JSON with citation probabilities, entity/semantic-cluster data, E-E-A-T scores, and content
  recommendations.
